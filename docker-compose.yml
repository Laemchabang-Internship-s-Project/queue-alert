services:
  app:
    build: .
    container_name: neoq-moph-alert
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: neoq-moph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moph_alert}
      POSTGRES_USER: ${POSTGRES_USER:-moph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moph_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moph} -d ${POSTGRES_DB:-moph_alert}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
